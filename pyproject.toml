[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powerdeck"
version = "0.1.0.dev0"
description = "Capability-driven Linux power management for Dell laptops"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "minh23102011" },
]
keywords = [
  "linux",
  "power-management",
  "battery",
  "dell",
  "niri",
]
dependencies = []

[project.scripts]
powerdeckctl = "powerdeck_cli.main:main"
powerdeck-thermalctl = "powerdeck_daemon.thermalctl:main"

[project.urls]
Repository = "https://github.com/minh23102011/fork-dell-power-manager"
Issues = "https://github.com/minh23102011/fork-dell-power-manager/issues"

[project.optional-dependencies]
dev = [
  "build",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/powerdeck_core",
  "src/powerdeck_backends",
  "src/powerdeck_cli",
  "src/powerdeck_daemon",
  "src/powerdeck_agent",
  "src/powerdeck_app",
]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = [
  "powerdeck_core",
  "powerdeck_backends",
  "powerdeck_cli",
  "powerdeck_daemon",
  "powerdeck_agent",
  "powerdeck_app",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.coverage.run]
branch = true
source = [
  "powerdeck_core",
  "powerdeck_backends",
  "powerdeck_cli",
  "powerdeck_daemon",
  "powerdeck_agent",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
